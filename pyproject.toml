[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mygarmin"
version = "0.1.0"
description = "Garmin Connect adatok lokális mentése, tárolása és elemzése"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect==0.3.17",
    "markdown>=3.11",
    "openai>=3.22.1",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
analysis = ["pandas", "matplotlib", "jupyter", "fitparse"]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
mygarmin = "mygarmin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
